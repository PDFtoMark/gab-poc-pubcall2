name: caller
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
jobs:
  call:
    if: |
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'retest'))
    uses: PDFtoMark/gab-poc-privlib/.github/workflows/lib.yml@main
    with:
      debug: true
    secrets:
      TOK: ${{ secrets.SCCM_GITHUB_APP_ID }}
